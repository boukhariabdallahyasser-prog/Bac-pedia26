name: Check Bac-pedia frontend

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/check-frontend.mjs"
      - ".github/workflows/check-frontend.yml"
  pull_request:
    paths:
      - "index.html"
      - "scripts/check-frontend.mjs"
      - ".github/workflows/check-frontend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-frontend.mjs
